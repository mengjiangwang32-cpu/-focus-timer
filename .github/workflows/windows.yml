name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    branches: ['codex/shiguang-v1']
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - run: npm run test:ui -- --reporter=github
      - run: npm run dist:win
      - run: npm run pack:win
      - name: Create source archive and checksums
        shell: pwsh
        run: |
          git archive --format=zip --output=release/Shiguang-Focus-1.0.0-Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Get-ChildItem release/Shiguang-Focus-1.0.0-* -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" } |
            Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Shiguang-Focus-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish download files
        if: github.ref == 'refs/heads/codex/shiguang-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'shiguang-v1.0.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This version already exists. Refusing to overwrite it.' }
          gh release create $tag `
            'release/Shiguang-Focus-1.0.0-Windows-x64.exe' `
            'release/Shiguang-Focus-1.0.0-Windows-x64.zip' `
            'release/Shiguang-Focus-1.0.0-Source.zip' `
            'release/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title '拾光专注 1.0.0' `
            --notes-file 'docs/发布说明.md'
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: test-results
